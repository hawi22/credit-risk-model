name: CI Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn mlflow pytest fastapi uvicorn pydantic
      - name: Run Tests
        run: |
          pytest tests/